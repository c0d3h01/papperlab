services:
  api:
    build: .
    image: paperlab-api
    ports:
      # Loopback only: keeps the API off the LAN by default.
      # Change to "8080:8080" if you need LAN access.
      - "127.0.0.1:8080:8080"
    environment:
      PAPERLAB_ADDR: ":8080"
      PAPERLAB_DATA_DIR: "/data"
      # Serve the web UI from the API container. Set to 0 when the UI is hosted separately.
      PAPERLAB_SERVE_WEB: "${PAPERLAB_SERVE_WEB:-1}"
      PAPERLAB_CORS_ORIGINS: "${PAPERLAB_CORS_ORIGINS:-*}"
      PAPERLAB_TRUSTED_PROXIES: "${PAPERLAB_TRUSTED_PROXIES:-}"
      PAPERLAB_WEB_DIR: "${PAPERLAB_WEB_DIR:-web}"
      PAPERLAB_MAX_UPLOAD_MB: "${PAPERLAB_MAX_UPLOAD_MB:-250}"
      PAPERLAB_MAX_FILES: "${PAPERLAB_MAX_FILES:-30}"
      PAPERLAB_JOB_TTL_MIN: "${PAPERLAB_JOB_TTL_MIN:-120}"
      PAPERLAB_JOB_TIMEOUT_MIN: "${PAPERLAB_JOB_TIMEOUT_MIN:-20}"
      PAPERLAB_RATE_LIMIT_PER_MIN: "${PAPERLAB_RATE_LIMIT_PER_MIN:-240}"
      PAPERLAB_ALLOW_LOCAL_URLS: "${PAPERLAB_ALLOW_LOCAL_URLS:-false}"
      PAPERLAB_CHROME_PATH: "${PAPERLAB_CHROME_PATH:-}"
      PAPERLAB_LIBREOFFICE_PATH: "${PAPERLAB_LIBREOFFICE_PATH:-}"
      PAPERLAB_API_KEY: "${PAPERLAB_API_KEY:-}"
      PAPERLAB_AI_BASE_URL: "${PAPERLAB_AI_BASE_URL:-}"
      PAPERLAB_AI_API_KEY: "${PAPERLAB_AI_API_KEY:-}"
      PAPERLAB_AI_MODEL: "${PAPERLAB_AI_MODEL:-}"
      PAPERLAB_LIBRETRANSLATE_URL: "${PAPERLAB_LIBRETRANSLATE_URL:-}"
    volumes:
      - paperlab-data:/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  paperlab-data:
